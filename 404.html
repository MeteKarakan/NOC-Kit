<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Sayfa bulunamadı | NOC-Kit</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<script>
(function(){try{var t=localStorage.getItem("nockit:theme");if(!t){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0E1218; --panel:#161C25; --border:#2A3242; --text:#E8E7E1; --text-dim:#8C93A3; --accent:#C7926A;
    --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace; }
  :root[data-theme="light"]{ --bg:#F3F2EE; --panel:#FFFFFF; --border:#DAD8D0; --text:#1B1E24; --text-dim:#5A6070; --accent:#8A5A2B; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font-family:var(--sans); padding:24px; }
  .card{ max-width:480px; text-align:center; border:1px solid var(--border); background:var(--panel); border-radius:6px; padding:40px 32px; }
  .code{ font-family:var(--mono); color:var(--accent); font-size:13px; letter-spacing:.1em; margin-bottom:10px; }
  h1{ font-size:26px; margin:0 0 10px; }
  p{ color:var(--text-dim); font-size:14px; line-height:1.6; margin:0 0 24px; }
  a.btn{ display:inline-block; font-family:var(--mono); font-size:13px; padding:10px 18px; border:1px solid var(--accent); color:var(--accent); text-decoration:none; border-radius:4px; transition:background .15s,color .15s; }
  a.btn:hover{ background:var(--accent); color:var(--bg); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">HTTP 404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız araç ya taşınmış ya da hiç var olmamış olabilir. NOC-Kit tek sayfalık bir uygulamadır — tüm araçlara ana sayfadan ulaşabilirsiniz.</p>
    <a class="btn" href="/">← Ana sayfaya dön</a>
  </div>
</body>
</html>
